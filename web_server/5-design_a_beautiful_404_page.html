<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Lost in space</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 120%, #3b2a7a, #0b0b1f 60%);
    font-family: Georgia, "Times New Roman", serif; color: #f4f1ff; overflow: hidden;
    text-align: center;
  }
  .stars, .stars::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 120px 80px, #fff, transparent),
      radial-gradient(2px 2px at 220px 160px, #ffd, transparent),
      radial-gradient(1px 1px at 300px 40px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 380px 120px, #cdf, transparent);
    background-size: 400px 200px; animation: drift 60s linear infinite; opacity: .8;
  }
  .stars::after { background-size: 270px 140px; animation-duration: 90s; opacity: .5; }
  @keyframes drift { to { background-position: -400px 200px; } }
  main { position: relative; z-index: 1; padding: 2rem; max-width: 640px; }
  .code { font-size: clamp(5rem, 22vw, 11rem); font-weight: 700; letter-spacing: .05em; line-height: 1; }
  .code span { display: inline-block; animation: float 4s ease-in-out infinite; }
  .code .planet {
    width: 1em; height: 1em; border-radius: 50%; vertical-align: -.08em;
    background: radial-gradient(circle at 30% 30%, #ffd89b, #e8743b 60%, #7a2e1a);
    box-shadow: 0 0 40px rgba(255, 170, 90, .5); animation-delay: -1.3s;
    position: relative;
  }
  .code .planet::after {
    content: ""; position: absolute; left: -22%; right: -22%; top: 42%; height: 16%;
    border: 4px solid rgba(255, 235, 200, .75); border-radius: 50%; transform: rotate(-18deg);
  }
  .code span:last-child { animation-delay: -2.4s; }
  @keyframes float { 50% { transform: translateY(-14px); } }
  h1 { font-size: 1.9rem; margin: 1.2rem 0 .4rem; }
  p { color: #cfc8f2; margin-bottom: 1.8rem; line-height: 1.5; }
  a {
    display: inline-block; padding: .8rem 1.8rem; border-radius: 999px;
    color: #14102e; background: linear-gradient(90deg, #ffd89b, #ff9d6c);
    text-decoration: none; font-weight: 700; transition: transform .2s, box-shadow .2s;
  }
  a:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 157, 108, .4); }
</style>
</head>
<body>
  <div class="stars"></div>
  <main>
    <div class="code"><span>4</span><span class="planet"></span><span>4</span></div>
    <h1>Ceci n'est pas une page</h1>
    <p>The page you are looking for drifted off into space. It is not here, but plenty of other places are.</p>
    <a href="/">Take me home</a>
  </main>
</body>
</html>
